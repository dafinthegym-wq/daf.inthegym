# Configuración para publicar en Netlify (conecta la carpeta "web" como base del sitio)
[build]
  base = "web"
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Archivos con nombre único (CSS/JS compilados): caché de 1 año
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Imágenes: caché de 30 días
[[headers]]
  for = "/img/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

# Páginas: siempre la versión más reciente
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"

# www → dominio principal (una sola versión para Google)
[[redirects]]
  from = "https://www.dafinthegym.com/*"
  to = "https://dafinthegym.com/:splat"
  status = 301
  force = true

# Direcciones viejas con ?lang= → la dirección de cada idioma
[[redirects]]
  from = "/*"
  to = "/en/"
  status = 301
  query = { lang = "en" }

[[redirects]]
  from = "/*"
  to = "/"
  status = 301
  query = { lang = "es" }
